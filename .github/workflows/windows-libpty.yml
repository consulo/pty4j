name: windows-libpty

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            msvc_arch: x64
            cmake_arch: x64
            pe_machine: x64
            runs_on: windows-2022
          - arch: aarch64
            msvc_arch: arm64
            cmake_arch: ARM64
            pe_machine: ARM64
            runs_on: windows-11-arm

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure CMake
        shell: cmd
        run: >
            cmake -S native/win-helper -B build/win-helper
            -G "Visual Studio 17 2022"
            -A ${{ matrix.cmake_arch }}
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build/win-helper --config Release

      - name: Verify PE machine
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find build/win-helper -type f -name win-helper.dll | head -1)
          echo "File: $DLL"
          dumpbin //HEADERS "$DLL" | grep -E "machine \(.*\)" | head -1
          MACHINE=$(dumpbin //HEADERS "$DLL" | grep -E "machine \(.*\)" | head -1 | sed -E 's/.*machine \(([^)]*)\).*/\1/')
          if [ "$MACHINE" != "${{ matrix.pe_machine }}" ]; then
              echo "::error::PE machine mismatch. Expected '${{ matrix.pe_machine }}' for ${{ matrix.arch }}, got '$MACHINE'."
              exit 1
          fi
          echo "OK: PE machine is '$MACHINE' as expected."

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find build/win-helper -type f -name win-helper.dll | head -1)
          mkdir -p out/windows-${{ matrix.arch }}
          cp "$DLL" out/windows-${{ matrix.arch }}/win-helper.dll

      - uses: actions/upload-artifact@v4
        with:
          name: libpty-windows-${{ matrix.arch }}
          path: out
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: binaries-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Arrange binaries by os-arch
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/libpty-windows-*/windows-*/; do
              arch_dir=$(basename "$dir")
              mkdir -p "out/$arch_dir"
              cp "$dir"win-helper.dll "out/$arch_dir/"
          done
          find out -type f

      - name: Commit and push to consulo/binaries
        env:
          CONSULO_BOT_TOKEN: ${{ secrets.CONSULO_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://consulo-bot:${CONSULO_BOT_TOKEN}@github.com/consulo/binaries.git" binaries-repo
          cd binaries-repo
          git checkout master 2>/dev/null || git checkout --orphan master
          git config user.name "consulo Bot"
          git config user.email "consulo.bot@gmail.com"
          cp -r ../out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update pty4j win-helper.dll (windows) from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push -u origin master
          fi
